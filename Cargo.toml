[workspace]
members = ["noeio", "noeio-center", "noeio-common", "noeio-derp", "noeio-proto"]

[workspace.dependencies]
noeio-common = { path = "noeio-common" }
noeio-proto = { path = "noeio-proto" }
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["full"] }
boringtun = "0.7"
x25519-dalek = "2.0.1"
tun = "0.8.5"
clap = "4"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
stun_codec = "0.4.0"
rand = "0.10.0"
bytecodec = "0.5.0"
bytes = "1.11.1"
dashmap = "6.1.0"
tonic = "0.14"
tokio-stream = "0.1"
prost = "0.14"
tonic-prost = "0.14.5"
tonic-build = "0.14.5"
tonic-prost-build = "0.14.5"
serde = "1.0.228"
toml = "1.0.6+spec-1.1.0"
tower = "0.5"
hyper-util = "0.1"
smoltcp = { version = "0.13.0", default-features = false, features = ["proto-ipv4"] }
pnet = "0.35.0"
hostname = "0.4.2"
moka = { version = "0.12", features = ["sync"] }
uuid = "1"
async-trait = "0.1"

