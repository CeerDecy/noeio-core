[package]
name = "noeio-net-route"
version = "0.1.1"
edition = "2024"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
net-route = "0.4.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
